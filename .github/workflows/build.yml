name: Go

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main", "v2" ]

permissions:
  contents: read

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: stable

    - name: Build
      run: go build ./...

    - name: Vet
      run: go vet ./...

    - name: Run tests
      run: go test -coverprofile=coverage.txt ./...

    - name: Lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.14.0

    - name: Check for vulnerabilities
      run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

    - name: Require 75% coverage of internal
      if: matrix.os == 'ubuntu-latest'
      run: |
        grep -e '^mode:' -e '/internal/' coverage.txt > internal.txt
        total=$(go tool cover -func=internal.txt | awk '/^total:/ { sub("%", "", $3); print $3 }')
        echo "internal coverage: ${total}%"
        awk -v total="$total" 'BEGIN { exit !(total >= 75) }'

    - name: Upload results to Codecov
      if: matrix.os == 'ubuntu-latest'
      uses: codecov/codecov-action@v7
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
