name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      
      - name: Fetch all tags
        run: git fetch --force --tags
      
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: stable
      
      - name: Vet
        run: go vet ./...

      - name: Run tests
        run: go test ./...
      
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # an rc and its final tag share a commit; build the tag that was pushed
          GORELEASER_CURRENT_TAG: ${{ github.ref_name }}

      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-checksums: dist/checksums.txt
